# nginx front door for the self-hosted Tianxuan stack.
#
# Mounted read-only at /etc/nginx/nginx.conf by deploy/docker-compose.yml.
#   /                 -> web:3000   (Next.js)
#   /api/             -> api:8000   (FastAPI, path prefix preserved)
#   /api/v1/ws/       -> api:8000   (WebSocket upgrade)
#
# This config is specific to Docker Compose: it uses Docker's embedded DNS
# resolver (127.0.0.11) to follow container recreations. It terminates plain
# HTTP only; TLS belongs on an outer proxy (see deploy/README.md).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Requirement Markdown and JSON payloads are small, but leave headroom.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # If an outer TLS proxy already set X-Forwarded-Proto, keep it; otherwise
    # report this connection's scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Docker's embedded DNS. Resolving upstreams per request avoids stale
    # container IPs after `docker compose up` recreates api or web.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # WebSocket document rooms. Must be declared with its own upgrade
        # headers; the longest-prefix match wins over /api/ below.
        location /api/v1/ws/ {
            set $api_ws http://api:8000;
            proxy_pass $api_ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # FastAPI. No URI part in proxy_pass, so /api/v1/... reaches the API
        # unchanged (the FastAPI routes already include the /api prefix).
        location /api/ {
            set $api_http http://api:8000;
            proxy_pass $api_http;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Next.js pages and static assets.
        location / {
            set $web_http http://web:3000;
            proxy_pass $web_http;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_read_timeout 60s;
        }
    }
}
