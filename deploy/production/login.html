<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天璇 · 访问受保护</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 30% 20%, #1c1b17 0, #0c0c0a 55%, #070706 100%);
      color: #f2eee4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(520px, calc(100vw - 48px)); padding: 40px;
      border: 1px solid rgba(242, 238, 228, 0.14); border-radius: 20px;
      background: rgba(20, 20, 17, 0.82); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .seal {
      width: 46px; height: 46px; display: grid; place-items: center;
      border: 1px solid rgba(201, 168, 92, 0.6); border-radius: 12px;
      color: #d7b56d; font-size: 22px; font-weight: 600; margin-bottom: 22px;
    }
    h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
    p { margin: 0 0 12px; color: #b9b3a6; line-height: 1.75; font-size: 14px; }
    code {
      background: rgba(242, 238, 228, 0.08); padding: 2px 6px; border-radius: 5px;
      color: #e6d7b4; font-size: 12px;
    }
    .hint { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(242, 238, 228, 0.1); font-size: 12px; color: #7f7a6e; }
    form { display: flex; gap: 10px; margin-top: 22px; }
    input {
      flex: 1; min-width: 0; padding: 11px 12px; border-radius: 9px;
      border: 1px solid rgba(242, 238, 228, 0.18); background: rgba(242, 238, 228, 0.06);
      color: #f2eee4; font: inherit; font-size: 13px; outline: none;
    }
    input:focus { border-color: rgba(215, 181, 109, 0.65); }
    button {
      padding: 11px 18px; border-radius: 9px; border: 1px solid rgba(215, 181, 109, 0.55);
      background: rgba(215, 181, 109, 0.12); color: #e6d7b4; font: inherit; font-size: 13px;
      cursor: pointer; white-space: nowrap;
    }
    button:hover { background: rgba(215, 181, 109, 0.2); }
  </style>
</head>
<body>
  <main class="card">
    <div class="seal">璇</div>
    <h1>访问受保护</h1>
    <p>天璇工作台需要访问密钥。请使用管理员提供的完整链接打开，链接中应包含 <code>/gate?key=…</code> 参数。</p>
    <p>也可以直接粘贴访问密钥：</p>
    <form action="/gate" method="get">
      <input name="key" autocomplete="off" placeholder="访问密钥" aria-label="访问密钥">
      <button type="submit">进入</button>
    </form>
    <p style="margin-top:18px">打开一次后，浏览器会保存 30 天有效的访问凭据，之后直接访问首页即可。</p>
    <div class="hint">如果你没有访问密钥，请联系部署管理员重新获取。</div>
  </main>
</body>
</html>
