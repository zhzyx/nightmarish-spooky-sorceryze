# Report GitHub Actions test results back to Tianxuan as a commit status.
#
# Configure repository secrets TIANXUAN_URL and TIANXUAN_TOKEN, then set
# TIANXUAN_REQUIRED_CHECKS=tianxuan-ci on the Tianxuan server if the merge
# queue must wait for this status.
name: tianxuan-status
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run project tests
        id: tests
        run: |
          # Replace with the project's real test command.
          echo "replace this step with the project test command"

      - name: Report status to Tianxuan
        if: always()
        env:
          TIANXUAN_URL: ${{ secrets.TIANXUAN_URL }}
          TIANXUAN_TOKEN: ${{ secrets.TIANXUAN_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -eu
          state=success
          if [ "$OUTCOME" != "success" ]; then state=failure; fi
          curl -fsS -X POST \
            "$TIANXUAN_URL/api/v1/repos/${REPOSITORY}/statuses/${SHA}" \
            -H "Authorization: Bearer ${TIANXUAN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"${state}\",\"context\":\"tianxuan-ci\",\"description\":\"github actions\",\"target_url\":\"${TIANXUAN_URL}\"}"
