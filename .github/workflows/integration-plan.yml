name: Integration preparation planner

on:
  pull_request:
    paths:
      - "customizations/platforms/development/git/heqi/**"
      - ".github/workflows/integration-plan.yml"
  merge_group:

permissions:
  contents: read

jobs:
  planner-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify commit-bound conflict planning
        run: python customizations/platforms/development/git/heqi/test_integration_plan.py
