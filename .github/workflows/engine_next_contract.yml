name: Engine Next build contract

on:
  pull_request:
    paths:
      - ".github/workflows/engine_next_contract.yml"
      - "engine_next/**"
      - "modules/gameplay/**"
      - "runtime_next/**"
      - "tools/check_engine_next_contract.py"
      - "tools/engine_next_contract.json"
      - "tools/test_check_engine_next_contract.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/engine_next_contract.yml"
      - "engine_next/**"
      - "modules/gameplay/**"
      - "runtime_next/**"
      - "tools/check_engine_next_contract.py"
      - "tools/engine_next_contract.json"
      - "tools/test_check_engine_next_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: No Godot source or link dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run contract and build-tool tests
        run: |
          python -m unittest tools.test_check_engine_next_contract -v
          python -m unittest discover -s engine_next/Tools -p "Test*.py" -v

      - name: Build and audit standalone tests (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          python engine_next/Tools/BuildGameplay.py --repo . --compiler msvc --build-dir build/engine_next/msvc-release --run-tests
          python tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-release/LinkManifest.json

      - name: Build and audit standalone tests (Clang)
        if: runner.os == 'macOS'
        run: |
          python3 engine_next/Tools/BuildGameplay.py --repo . --compiler clang --build-dir build/engine_next/clang-release --run-tests
          python3 tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/clang-release/LinkManifest.json
