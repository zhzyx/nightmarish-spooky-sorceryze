name: Engine Next build contract

on:
  pull_request:
    paths:
      - ".github/workflows/engine_next_contract.yml"
      - "ai_core/**"
      - "engine_next/**"
      - "modules/gameplay/**"
      - "runtime_next/**"
      - "tools/check_engine_next_contract.py"
      - "tools/engine_next_contract.json"
      - "tools/test_check_engine_next_contract.py"
      - "tools/engine_next_legacy/**"
      - "tools/ainative/**"
      - "tools/package_maliang_editor.py"
      - "tools/editor_native_app.py"
      - "tools/package_tianshu_ui.py"
      - "tools/editor_provenance_process.py"
      - "tools/maliang_hunyuan/**"
      - "samples/ainative-workbench/**"
      - "editor/ainative/**"
      - "tests/editor/test_ainative_bundle.py"
      - "tests/editor/test_maliang_package.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/engine_next_contract.yml"
      - "ai_core/**"
      - "engine_next/**"
      - "modules/gameplay/**"
      - "runtime_next/**"
      - "tools/check_engine_next_contract.py"
      - "tools/engine_next_contract.json"
      - "tools/test_check_engine_next_contract.py"
      - "tools/engine_next_legacy/**"
      - "tools/ainative/**"
      - "tools/package_maliang_editor.py"
      - "tools/editor_native_app.py"
      - "tools/package_tianshu_ui.py"
      - "tools/editor_provenance_process.py"
      - "tools/maliang_hunyuan/**"
      - "samples/ainative-workbench/**"
      - "editor/ainative/**"
      - "tests/editor/test_ainative_bundle.py"
      - "tests/editor/test_maliang_package.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: No Godot source or link dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-26
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pillow==12.1.1

      - name: Run contract and build-tool tests
        run: |
          python -m unittest tools.test_check_engine_next_contract -v
          python -m unittest discover -s engine_next/Tools -p "Test*.py" -v

      - name: Run complete AINative and package regressions
        run: |
          python -m unittest discover -s tools/ainative -p "test_*.py"
          python -m unittest tests.editor.test_ainative_bundle tests.editor.test_maliang_package -v

      - name: Build and audit standalone tests (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          python engine_next/Tools/BuildGameplay.py --repo . --compiler msvc --build-dir build/engine_next/msvc-release --run-tests
          python tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-release/LinkManifest.json
          python engine_next/Tools/BuildRuntime.py --repo . --compiler msvc --build-dir build/engine_next/msvc-runtime --run-tests --soak
          python tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-runtime/next_serverLinkManifest.json
          python tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-runtime/next_clientLinkManifest.json
          python tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-runtime/next_assetLinkManifest.json
          python tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-runtime/EngineNextRuntimeTestsLinkManifest.json
          python engine_next/Tools/ExportCleanSource.py --repo . --output build/engine_next/clean-runtime-source
          python build/engine_next/clean-runtime-source/engine_next/Tools/BuildRuntime.py --repo build/engine_next/clean-runtime-source --compiler msvc --build-dir build/engine_next/msvc-runtime --run-tests
          python build/engine_next/clean-runtime-source/tools/check_engine_next_contract.py --repo build/engine_next/clean-runtime-source --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-runtime/next_serverLinkManifest.json
          python build/engine_next/clean-runtime-source/tools/check_engine_next_contract.py --repo build/engine_next/clean-runtime-source --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-runtime/next_clientLinkManifest.json
          python build/engine_next/clean-runtime-source/tools/check_engine_next_contract.py --repo build/engine_next/clean-runtime-source --require-sources --require-link-manifest --link-manifest build/engine_next/msvc-runtime/next_assetLinkManifest.json

      - name: Build and audit standalone tests (Clang)
        if: runner.os != 'Windows'
        run: |
          python3 engine_next/Tools/BuildGameplay.py --repo . --compiler clang --build-dir build/engine_next/clang-release --run-tests
          python3 tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/clang-release/LinkManifest.json
          python3 engine_next/Tools/BuildRuntime.py --repo . --compiler clang --build-dir build/engine_next/clang-runtime --run-tests --soak
          python3 tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/clang-runtime/next_serverLinkManifest.json
          python3 tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/clang-runtime/next_clientLinkManifest.json
          python3 tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/clang-runtime/next_assetLinkManifest.json
          python3 tools/check_engine_next_contract.py --repo . --require-sources --require-link-manifest --link-manifest build/engine_next/clang-runtime/EngineNextRuntimeTestsLinkManifest.json
          python3 engine_next/Tools/ExportCleanSource.py --repo . --output build/engine_next/clean-runtime-source
          python3 build/engine_next/clean-runtime-source/engine_next/Tools/BuildRuntime.py --repo build/engine_next/clean-runtime-source --compiler clang --build-dir build/engine_next/clang-runtime --run-tests
          python3 build/engine_next/clean-runtime-source/tools/check_engine_next_contract.py --repo build/engine_next/clean-runtime-source --require-sources --require-link-manifest --link-manifest build/engine_next/clang-runtime/next_serverLinkManifest.json
          python3 build/engine_next/clean-runtime-source/tools/check_engine_next_contract.py --repo build/engine_next/clean-runtime-source --require-sources --require-link-manifest --link-manifest build/engine_next/clang-runtime/next_clientLinkManifest.json
          python3 build/engine_next/clean-runtime-source/tools/check_engine_next_contract.py --repo build/engine_next/clean-runtime-source --require-sources --require-link-manifest --link-manifest build/engine_next/clang-runtime/next_assetLinkManifest.json

      - name: Validate deterministic visual GPU packages (Windows)
        if: runner.os == 'Windows'
        run: |
          python engine_next/Tools/GenerateVisualBenchmarks.py --output build/engine_next/visual-benchmarks
          python engine_next/Tools/RunM42AssetAcceptance.py --next-asset build/engine_next/msvc-runtime/next_asset.exe --fixtures build/engine_next/visual-benchmarks --report build/engine_next/M42AssetReport.json

      - name: Validate deterministic visual GPU packages (portable)
        if: runner.os != 'Windows'
        run: |
          python3 engine_next/Tools/GenerateVisualBenchmarks.py --output build/engine_next/visual-benchmarks
          python3 engine_next/Tools/RunM42AssetAcceptance.py --next-asset build/engine_next/clang-runtime/next_asset --fixtures build/engine_next/visual-benchmarks --report build/engine_next/M42AssetReport.json

      - name: Verify legacy Godot scene adapter
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build/engine_next/godot-legacy
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o build/engine_next/godot-legacy/Godot.zip
          echo "d6e382fb531019f85630c1f485a561a0d20c4a2344b6c3847735cfee7da812aa  build/engine_next/godot-legacy/Godot.zip" | sha256sum -c -
          unzip -q build/engine_next/godot-legacy/Godot.zip -d build/engine_next/godot-legacy
          python3 engine_next/Tools/RunM3LegacyAcceptance.py --godot build/engine_next/godot-legacy/Godot_v4.4.1-stable_linux.x86_64 --next-asset build/engine_next/clang-runtime/next_asset --adapter tools/engine_next_legacy/scene_adapter.gd --fixtures tools/engine_next_legacy/fixtures --report build/engine_next/clang-runtime/M3LegacyReport.json
          python3 samples/ainative-workbench/test_unified_settings.py --godot build/engine_next/godot-legacy/Godot_v4.4.1-stable_linux.x86_64 --report build/engine_next/clang-runtime/MaliangSettingsReport.json

  visual-contract:
    name: Visual runtime build and FrameGraph (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-26
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and audit D3D12 client, shaders and FrameGraph
        if: runner.os == 'Windows'
        run: python engine_next/Tools/BuildVisualRuntime.py --build-dir build/engine_next/visual --run-tests

      - name: Build and audit portable FrameGraph tests
        if: runner.os != 'Windows'
        run: python3 engine_next/Tools/BuildVisualRuntime.py --compiler clang --tests-only --build-dir build/engine_next/visual --run-tests

      - name: Export physical clean source
        run: python engine_next/Tools/ExportCleanSource.py --output build/engine_next/visual-clean-source

      - name: Rebuild D3D12 client from clean source
        if: runner.os == 'Windows'
        run: >-
          python build/engine_next/visual-clean-source/engine_next/Tools/BuildVisualRuntime.py
          --repo build/engine_next/visual-clean-source --build-dir build/engine_next/visual --run-tests

      - name: Rebuild portable FrameGraph from clean source
        if: runner.os != 'Windows'
        run: >-
          python3 build/engine_next/visual-clean-source/engine_next/Tools/BuildVisualRuntime.py
          --repo build/engine_next/visual-clean-source --compiler clang --tests-only
          --build-dir build/engine_next/visual --run-tests

      # Hosted runners validate compilation and CPU contracts; real GPU evidence is collected on the reference PC.
      - name: Retain visual build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-runtime-${{ matrix.os }}
          path: |
            build/engine_next/visual/VisualBuildReport.json
            build/engine_next/visual/*LinkManifest.json
            build/engine_next/visual/Release/
            build/engine_next/visual-clean-sourceManifest.json
