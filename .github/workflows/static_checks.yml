name: 📊 Static Checks
on:
  workflow_call:
    outputs:
      has-metal:
        description: Whether this change needs an Apple rendering worker.
        value: ${{ jobs.static-checks.outputs.has-metal }}
      needs-d3d12:
        description: Whether the scoped Windows build needs the Direct3D 12 SDK.
        value: ${{ jobs.static-checks.outputs.needs-d3d12 }}
      build-base:
        description: Resolved base commit for the engine scope.
        value: ${{ jobs.static-checks.outputs.build-base }}
      build-mode:
        description: Engine build scope for this checkout.
        value: ${{ jobs.static-checks.outputs.build-mode }}
      changed-files:
        description: A list of changed files, pre-filtered for parsing by clangd-tidy.
        value: ${{ jobs.static-checks.outputs.changed-files }}
      sources-changed:
        description: Determines if any source files were changed.
        value: ${{ jobs.static-checks.outputs.sources-changed }}
  workflow_dispatch:

jobs:
  static-checks:
    name: Code style, file formatting, and docs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      has-metal: ${{ steps.engine-scope.outputs.has-metal }}
      needs-d3d12: ${{ steps.engine-scope.outputs.needs-d3d12 }}
      build-base: ${{ steps.engine-scope.outputs.build-base }}
      build-mode: ${{ steps.engine-scope.outputs.build-mode }}
      changed-files: '"${{ steps.changed-files.outputs.clangd_all_changed_files }}"' # Wrap with quotes to bookend internal quote separators.
      sources-changed: ${{ steps.changed-files.outputs.sources_any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Treeless clone. Slightly less performant than a shallow clone, but makes finding diffs instantaneous.
          filter: tree:0 # See: https://github.blog/open-source/git/get-up-to-speed-with-partial-clone-and-shallow-clone/

      # This needs to happen before Python and npm execution; it must happen before any extra files are written.
      - name: .gitignore checks (gitignore_check.sh)
        run: |
          bash ./misc/scripts/gitignore_check.sh

      - name: Plan engine compilation
        id: engine-scope
        env:
          BUILD_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          NEW_BRANCH_BASE: >-
            ${{ startsWith(github.ref, 'refs/heads/') && github.ref_name != github.event.repository.default_branch &&
                format('refs/remotes/origin/{0}', github.event.repository.default_branch) || '' }}
        run: |
          python3 tools/test_build_engine_modules.py
          python3 tools/build_engine_modules.py --ci-platform windows --committed --base "$BUILD_BASE" --new-branch-base "$NEW_BRANCH_BASE"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          safe_output: false # Output passed to environment variable to avoid command injection.
          separator: '" "' # To account for paths with spaces, ensure our items are split by quotes internally.
          skip_initial_fetch: true
          files_yaml_from_source_file: .github/changed_files.yml

      - name: Verify build placement evidence for new modules
        env:
          BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha
            || github.event.before != '0000000000000000000000000000000000000000' && github.event.before
            || 'origin/main' }}
        run: python3 -B customizations/components/issue-workorders/issue_gate.py --repo . --module-impact-only --base-ref "$BASE"

      - name: Style checks via prek
        uses: j178/prek-action@v3.0.0
        env:
          FROM_REF: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event.before != '0000000000000000000000000000000000000000' && github.event.before
            || 'HEAD~1' }}
        with:
          extra-args: --from-ref ${{ env.FROM_REF }}
