name: 🏁 Windows Builds
on:
  workflow_call:
    inputs:
      editor_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      editor_only:
        description: Validate only the Windows MSVC editor
        type: boolean
        default: false
      consultation_build_run:
        description: Successful Windows editor run to reuse for consultation native acceptance (no build)
        type: string
        default: ""

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.consultation_build_run == ''
    # Windows 10 with latest image
    runs-on: windows-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.editor_only && '{"include":[{"name":"Editor (target=editor)","cache-name":"windows-editor","target":"editor","scons-flags":"windows_subsystem=console vsproj=yes vsproj_gen_only=no","bin":"./bin/godot.windows.editor.x86_64.exe","compiler":"msvc"}]}' || '{"include":[{"name":"Editor (target=editor)","cache-name":"windows-editor","target":"editor","scons-flags":"windows_subsystem=console vsproj=yes vsproj_gen_only=no","bin":"./bin/godot.windows.editor.x86_64.exe","compiler":"msvc"},{"name":"Editor w/ clang-cl (target=editor, use_llvm=yes)","cache-name":"windows-editor-clang","target":"editor","scons-flags":"windows_subsystem=console use_llvm=yes","bin":"./bin/godot.windows.editor.x86_64.llvm.exe","compiler":"clang"},{"name":"Template (target=template_release)","cache-name":"windows-template","target":"template_release","bin":"./bin/godot.windows.template_release.x86_64.console.exe","compiler":"msvc"},{"name":"Template w/ GCC (target=template_release, use_mingw=yes)","cache-name":"windows-template-gcc","target":"template_release","scons-flags":"use_mingw=yes","bin":"./bin/godot.windows.template_release.x86_64.console.exe","compiler":"gcc"}]}') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        if: matrix.compiler == 'msvc'
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        if: matrix.compiler == 'msvc'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors

      - name: Daqian native editor graph
        if: matrix.compiler == 'msvc' && matrix.target == 'editor' && github.event_name == 'workflow_dispatch' && inputs.editor_only
        run: |
          python tests/editor/run_daqian_graph.py --godot ${{ matrix.bin }} --report daqian-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/editor/run_ai_chat_tab_order.py --godot ${{ matrix.bin }} --report daqian-tabs.json

      - name: Daqian cross-provider loopback in the editor
        if: matrix.compiler == 'msvc' && matrix.target == 'editor' && github.event_name == 'workflow_dispatch' && inputs.editor_only
        run: |
          python tests/editor/run_daqian_graph.py --scenario parallel --godot ${{ matrix.bin }} --report daqian-parallel.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor/daqian_model_harness.mjs

      - name: Upload Daqian editor results
        if: always() && matrix.compiler == 'msvc' && matrix.target == 'editor' && github.event_name == 'workflow_dispatch' && inputs.editor_only
        uses: actions/upload-artifact@v7
        with:
          name: daqian-windows-native
          path: daqian-*.json
          if-no-files-found: warn

  consultation-native:
    if: github.event_name == 'workflow_dispatch' && inputs.consultation_build_run != ''
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify successful build and unchanged build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.consultation_build_run }}
        run: |
          if ($env:BUILD_RUN -notmatch '^\d+$') { throw 'Numeric build run required' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows_builds.yml') { throw 'Successful Windows build required' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN/jobs" | ConvertFrom-Json
          if (-not ($jobs.jobs | Where-Object { $_.name -eq 'Editor (target=editor)' -and $_.conclusion -eq 'success' })) { throw 'Successful MSVC editor job required' }
          $changes = @(git diff --name-only $run.head_sha HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare build inputs' }
          foreach ($file in $changes) {
            if ($file -notmatch '^(data-collection/|design-docs/|gonggong-diting-data/|\.github/workflows/windows_builds\.yml$|tests/editor/(consultation_only\.gd|run_consultation_only\.py)$)') { throw "Build input changed: $file" }
          }
          New-Item -ItemType Directory -Force native-report | Out-Null
          @{ build_run = $env:BUILD_RUN; build_sha = $run.head_sha; test_sha = $env:GITHUB_SHA; allowed_nonbuild_changes = $changes } | ConvertTo-Json | Set-Content native-report/build-inputs.json
          gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --name windows-editor --dir native-editor
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
      - name: Native consultation permission regression
        run: python tests/editor/run_consultation_only.py --godot native-editor/godot.windows.editor.x86_64.exe --out native-report/consultation.json
      - name: Upload native report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consultation-native-report
          path: native-report/*
