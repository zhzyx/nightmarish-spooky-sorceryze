name: 🏁 Windows Builds
on:
  workflow_call:
    inputs:
      editor_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      editor_only:
        description: Validate only the Windows MSVC editor
        type: boolean
        default: false
      daqian_build_run:
        description: Successful default-branch build with matching native inputs for Tianshu acceptance
        type: string
        default: ""
      consultation_build_run:
        description: Successful default-branch build of this revision for consultation acceptance
        type: string
        default: ""

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  build-windows:
    # Windows 10 with latest image
    runs-on: windows-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((inputs.editor_only || inputs.consultation_build_run || inputs.daqian_build_run) && '{"include":[{"name":"Editor (target=editor)","cache-name":"windows-editor","target":"editor","scons-flags":"windows_subsystem=console vsproj=yes vsproj_gen_only=no","bin":"./bin/godot.windows.editor.x86_64.exe","compiler":"msvc"}]}' || '{"include":[{"name":"Editor (target=editor)","cache-name":"windows-editor","target":"editor","scons-flags":"windows_subsystem=console vsproj=yes vsproj_gen_only=no","bin":"./bin/godot.windows.editor.x86_64.exe","compiler":"msvc"},{"name":"Editor w/ clang-cl (target=editor, use_llvm=yes)","cache-name":"windows-editor-clang","target":"editor","scons-flags":"windows_subsystem=console use_llvm=yes","bin":"./bin/godot.windows.editor.x86_64.llvm.exe","compiler":"clang"},{"name":"Template (target=template_release)","cache-name":"windows-template","target":"template_release","bin":"./bin/godot.windows.template_release.x86_64.console.exe","compiler":"msvc"},{"name":"Template w/ GCC (target=template_release, use_mingw=yes)","cache-name":"windows-template-gcc","target":"template_release","scons-flags":"use_mingw=yes","bin":"./bin/godot.windows.template_release.x86_64.console.exe","compiler":"gcc"}]}') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Active provenance process ownership
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        run: |
          python tools/test_build_gonggong_editor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_windows_editor_artifact.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_editor_provenance_process.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ainative/test_owned_process.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s customizations/components/godot-host -p test_parent_completion.py -v

      - name: Download Direct3D 12 SDK components
        shell: bash
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py ${{ matrix.compiler == 'msvc' && matrix.target == 'editor' && '--msvc-only' || '' }}; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: bash
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: bash
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure reproducible MSVC editor metadata
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        run: |
          "GONGGONG_NATIVE_SOURCE_ARCHIVE=1" >> $env:GITHUB_ENV
          "BUILD_NAME=gh" >> $env:GITHUB_ENV

      - name: Look up an immutable Windows editor
        shell: bash
        id: editor
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.consultation_build_run || inputs.daqian_build_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_REVISION: ${{ github.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EDITOR_BUILD_FLAGS: platform=windows target=editor ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} redirect_build_objects=no
        run: python .github/scripts/windows_editor_artifact.py lookup

      - name: Generate the Visual Studio project for the current checkout
        if: steps.editor.outputs.hit == 'true'
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} vsproj_gen_only=yes d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}

      - name: Compilation
        if: steps.editor.outputs.hit != 'true'
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        if: steps.editor.outputs.hit != 'true'
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Package this checkout's Tianshu UI and record editor provenance
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        run: |
          python tools/package_tianshu_ui.py --output bin/tianshu-ui.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/windows_editor_artifact.py record

      - name: Prepare artifact
        if: matrix.compiler == 'msvc'
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        if: matrix.compiler == 'msvc'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Index trusted editor inputs for later candidates
        if: matrix.compiler == 'msvc' && matrix.target == 'editor' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-key-${{ steps.editor.outputs.key }}
          path: bin/windows-editor-inputs.json
          if-no-files-found: error
          retention-days: 60

      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ${{ matrix.bin }} --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ${{ matrix.bin }} --test --force-colors

      - name: Native reasoning session isolation and Codex wire regression
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        timeout-minutes: 5
        run: python tests/editor/run_reasoning_sessions.py --godot ${{ matrix.bin }} --node (Get-Command node).Source --report reasoning-report/native.json

      - name: Upload reasoning session report
        if: always() && matrix.compiler == 'msvc' && matrix.target == 'editor'
        uses: actions/upload-artifact@v7
        with:
          name: reasoning-session-isolation
          path: reasoning-report/*
          if-no-files-found: warn

      - name: Runtime deployment interruption and original request recovery
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        timeout-minutes: 10
        run: |
          git fetch --no-tags --depth=1 origin d237ef78cc394a98db85b6eb1b39f0184217297d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/editor/run_runtime_setup_simulation.py --godot ${{ matrix.bin }} --out runtime-report

      - name: Upload runtime simulation report
        if: always() && matrix.compiler == 'msvc' && matrix.target == 'editor'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-deployment-simulation
          path: runtime-report/*
          if-no-files-found: warn

      - name: Parent binding survives interrupted editor shutdown
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        timeout-minutes: 5
        run: |
          $editor = '${{ matrix.bin }}'.Replace('.console.exe', '.exe')
          python -X utf8 tests/editor/run_parent_binding_restart.py --godot $editor --out parent-recovery-report/binding.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/editor/run_parent_binding_restart.py --godot $editor --checkpoint-failure --out parent-recovery-report/binding-save-failure.json

      - name: Original design reconfirmation and independent continuation
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        timeout-minutes: 15
        run: |
          npm ci --prefix tools/codebuddy_cli --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force parent-recovery-report | Out-Null
          python -X utf8 -m unittest discover -s customizations/components/godot-host -p test_requirements_agent.py -v *> parent-recovery-report/requirements-json-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content parent-recovery-report/requirements-json-tests.log; exit $LASTEXITCODE }
          node --test tests/editor/test_codex_bridge.js *> parent-recovery-report/codex-json-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content parent-recovery-report/codex-json-tests.log; exit $LASTEXITCODE }
          $env:NATIVE_ACCEPTANCE_JOB_OBJECT = (Resolve-Path tools/codebuddy_cli/node_modules/@tencent-ai/codebuddy-code/bin/native/win32-x64/job-object.node).Path
          $editor = '${{ matrix.bin }}'.Replace('.console.exe', '.exe')
          python -X utf8 tests/editor/run_native_acceptance.py --godot $editor --node (Get-Command node).Source --scenario parallel-parent-restart --restore-confirmation --out parent-recovery-report/confirmation.json

      - name: Independent review missing execution evidence contract
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        timeout-minutes: 15
        run: |
          $env:NATIVE_ACCEPTANCE_JOB_OBJECT = (Resolve-Path tools/codebuddy_cli/node_modules/@tencent-ai/codebuddy-code/bin/native/win32-x64/job-object.node).Path
          $editor = '${{ matrix.bin }}'.Replace('.console.exe', '.exe')
          python -X utf8 tests/editor/run_native_acceptance.py --godot $editor --node (Get-Command node).Source --scenario parallel-evidence-completion --out parent-recovery-report/mixed-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/editor/run_native_acceptance.py --godot $editor --node (Get-Command node).Source --scenario parallel-evidence-completion --invalid-missing-evidence fail-null --out parent-recovery-report/rejected-fail-null.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/editor/run_native_acceptance.py --godot $editor --node (Get-Command node).Source --scenario parallel-evidence-completion --invalid-missing-evidence array --out parent-recovery-report/rejected-evidence-array.json

      - name: Persistent preparation and original dependent job recovery
        if: matrix.compiler == 'msvc' && matrix.target == 'editor'
        timeout-minutes: 20
        run: |
          $env:NATIVE_ACCEPTANCE_JOB_OBJECT = (Resolve-Path tools/codebuddy_cli/node_modules/@tencent-ai/codebuddy-code/bin/native/win32-x64/job-object.node).Path
          $editor = '${{ matrix.bin }}'.Replace('.console.exe', '.exe')
          python -X utf8 tests/editor/run_native_production_setup.py --godot $editor --node (Get-Command node).Source --backend codebuddy --case normal --preparation-recovery baseline --out parent-recovery-report/preparation-baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/editor/run_native_production_setup.py --godot $editor --node (Get-Command node).Source --backend codex --case normal --prepared-job-recovery cold --out parent-recovery-report/prepared-cold.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/editor/run_native_production_setup.py --godot $editor --node (Get-Command node).Source --backend codex --case normal --prepared-job-recovery warm --out parent-recovery-report/prepared-warm.json

      - name: Upload parent recovery reports
        if: always() && matrix.compiler == 'msvc' && matrix.target == 'editor'
        uses: actions/upload-artifact@v7
        with:
          name: parent-binding-design-recovery
          path: parent-recovery-report/*
          if-no-files-found: warn

      - name: Tianshu native editor graph
        if: matrix.compiler == 'msvc' && matrix.target == 'editor' && github.event_name == 'workflow_dispatch' && (inputs.editor_only || inputs.daqian_build_run)
        run: |
          python tests/editor/run_daqian_graph.py --godot ${{ matrix.bin }} --report daqian-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/editor/run_ai_chat_tab_order.py --godot ${{ matrix.bin }} --report daqian-tabs.json

      - name: Tianshu cross-provider loopback in the editor
        if: matrix.compiler == 'msvc' && matrix.target == 'editor' && github.event_name == 'workflow_dispatch' && (inputs.editor_only || inputs.daqian_build_run)
        run: |
          python tests/editor/run_daqian_graph.py --scenario parallel --godot ${{ matrix.bin }} --report daqian-parallel.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor/daqian_model_harness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/editor/run_daqian_graph.py --scenario entry --godot ${{ matrix.bin }} --report daqian-entry.json

      - name: Upload Tianshu editor results
        if: always() && matrix.compiler == 'msvc' && matrix.target == 'editor' && github.event_name == 'workflow_dispatch' && (inputs.editor_only || inputs.daqian_build_run)
        uses: actions/upload-artifact@v7
        with:
          name: daqian-windows-native
          path: daqian-*.json
          if-no-files-found: warn

      - name: Native consultation permission regression
        if: matrix.compiler == 'msvc' && matrix.target == 'editor' && inputs.consultation_build_run
        run: python tests/editor/run_consultation_only.py --godot ${{ matrix.bin }} --out native-report/consultation.json

      - name: Upload native consultation report
        if: always() && matrix.compiler == 'msvc' && matrix.target == 'editor' && inputs.consultation_build_run
        uses: actions/upload-artifact@v7
        with:
          name: consultation-native-report
          path: |
            native-report/*
            bin/windows-editor-inputs.json
