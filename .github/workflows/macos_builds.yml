name: 🍎 macOS Builds
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tianshu_only:
        description: Run the Tianshu arm64 editor acceptance suite
        type: boolean
        default: false

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-macos:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-26
    name: ${{ matrix.target == 'editor' && 'Editor (target=editor)' || 'Template (target=template_release)' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.tianshu_only && '["editor"]' || '["editor", "template_release"]') }}
    env:
      CACHE_NAME: ${{ matrix.target == 'editor' && 'macos-editor' || 'macos-template' }}
      EXTRA_FLAGS: ${{ matrix.target == 'template_release' && 'debug_symbols=no' || '' }}
      UNIVERSAL_BIN: ./bin/godot.macos.${{ matrix.target }}.universal

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ env.CACHE_NAME }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation (x86_64)
        if: ${{ !inputs.tianshu_only }}
        uses: ./.github/actions/godot-build
        with:
          # Silence warning about Metal not being supported in x86_64 builds using `metal=no`.
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ env.EXTRA_FLAGS }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} metal=no
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ env.EXTRA_FLAGS }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Verify Tianshu package switching on arm64
        if: matrix.target == 'editor'
        run: python3 tests/editor/run_tianshu_ui_package.py --godot ./bin/godot.macos.editor.arm64 --report "$RUNNER_TEMP/tianshu-package.json"

      - name: Verify external host trust on macOS
        if: matrix.target == 'editor'
        run: |
          python3 -m unittest discover -s tools -p test_editor_trusted_hosts.py -v
          ./bin/godot.macos.editor.arm64 --headless --test --test-case='[Editor][AIChat][ExternalPeer]*'

      - name: Verify Tianshu creator navigation on arm64
        if: matrix.target == 'editor'
        run: |
          for attempt in 1 2 3; do
            python3 tests/editor/run_daqian_graph.py --scenario graph --godot ./bin/godot.macos.editor.arm64 --report "$RUNNER_TEMP/tianshu-graph-$attempt.json"
          done

      - name: Verify Tianshu work-order interactions on arm64
        if: inputs.tianshu_only
        run: |
          for scenario in direct publish parallel entry; do
            python3 tests/editor/run_daqian_graph.py --scenario "$scenario" --godot ./bin/godot.macos.editor.arm64 --report "$RUNNER_TEMP/tianshu-$scenario.json"
          done

      - name: Verify automatic model discovery and cancellation
        if: inputs.tianshu_only
        run: |
          python3 tests/editor/run_model_autofetch.py --godot ./bin/godot.macos.editor.arm64 --source . --node "$(command -v node)" --out "$RUNNER_TEMP/model-autofetch.json"

      - name: Save Godot build cache
        if: ${{ !inputs.tianshu_only }}
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ env.CACHE_NAME }}
        continue-on-error: true

      - name: Prepare artifact
        if: ${{ !inputs.tianshu_only }}
        run: |
          lipo -create ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64 -output ./bin/godot.macos.${{ matrix.target }}.universal
          rm ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        if: ${{ !inputs.tianshu_only }}
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ env.CACHE_NAME }}

      - name: Unit tests
        if: ${{ !inputs.tianshu_only }}
        run: |
          ${{ env.UNIVERSAL_BIN }} --version
          ${{ env.UNIVERSAL_BIN }} --help
          ${{ env.UNIVERSAL_BIN }} --test --force-colors
