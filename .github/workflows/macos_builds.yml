name: macOS startup validation for 2123
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 6ebc11ab0271e993646860f05e39d19a2ec1c9b6
          path: frozen
          sparse-checkout: |
            data-collection/q05-f01-common.json
            misc/dist/macos_tools.app
            tests/editor/macos_startup_validation.gd
            tests/editor/run_macos_startup_validation.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45062919388
          artifact-ids: 14771815768
          path: ${{ runner.temp }}/download
          merge-multiple: true
      - name: Reconstruct and verify original signed application
        id: reconstruct
        run: |
          app="$RUNNER_TEMP/Q05.app"
          mkdir -p "$RUNNER_TEMP/binary" "$RUNNER_TEMP/evidence"
          tar -C "$RUNNER_TEMP/binary" -xzf "$RUNNER_TEMP/download/registered-worker-editor.tar.gz"
          cd "$RUNNER_TEMP/binary"
          shasum -a 256 -c <<'HASHES'
          556482d839e8c268734d408a4b9d0639f7147adfede0049e76b6bdbb814bb524  godot.macos.editor.arm64
          3b581a11d1e472eb698a6da997d5e0887bdf7864ea0cf802504973bf68feb462  tianshu-ui.json
          22e1a6c2ba41163d7521cb9700e40b91e81a0a2dfffefeeb523cdfd3a0f6780b  tianshu-board.json
          HASHES
          ditto "$GITHUB_WORKSPACE/frozen/misc/dist/macos_tools.app" "$app"
          mkdir -p "$app/Contents/MacOS"
          cp godot.macos.editor.arm64 "$app/Contents/MacOS/Godot"
          cp tianshu-{ui,board}.json "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          cp godot.macos.editor.arm64 "$app/Contents/MacOS/Godot"
          codesign --verify --deep --strict --verbose=2 "$app"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$app/Contents/MacOS/Godot" "$app"/Contents/Resources/tianshu-*.json frozen/data-collection/q05-f01-common.json > "$RUNNER_TEMP/evidence/digests.txt"
      - name: Reproduce early close with a delayed real child
        run: |
          python3 tests/editor/reproduce_2123_schedule.py --expect-old-race --script frozen/tests/editor/run_macos_startup_validation.py --app "$RUNNER_TEMP/Q05.app" --manifest frozen/data-collection/q05-f01-common.json --report "$RUNNER_TEMP/evidence/original.json"
      - name: Exercise the repaired Cocoa harness under the same delay
        if: ${{ !cancelled() && steps.reconstruct.outcome == 'success' }}
        run: |
          python3 tests/editor/reproduce_2123_schedule.py --script tests/editor/run_macos_startup_validation.py --app "$RUNNER_TEMP/Q05.app" --manifest frozen/data-collection/q05-f01-common.json --report "$RUNNER_TEMP/evidence/startup.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cocoa-startup-2123
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
