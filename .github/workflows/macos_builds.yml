name: 🍎 macOS Builds
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tianshu_only:
        description: Run the Tianshu arm64 editor acceptance suite
        type: boolean
        default: false
      maliang_save_ui:
        description: Run only the Maliang native Save panel acceptance on the arm64 editor
        type: boolean
        default: false
      registered_worker_close:
        description: Verify a registered local worker stops and resumes across Cocoa editor sessions
        type: boolean
        default: false

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-macos:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-26
    name: ${{ matrix.target == 'editor' && 'Editor (target=editor)' || 'Template (target=template_release)' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((inputs.tianshu_only || inputs.maliang_save_ui || inputs.registered_worker_close) && '["editor"]' || '["editor", "template_release"]') }}
    env:
      CACHE_NAME: ${{ matrix.target == 'editor' && 'macos-editor' || 'macos-template' }}
      EXTRA_FLAGS: ${{ matrix.target == 'template_release' && 'debug_symbols=no' || '' }}
      UNIVERSAL_BIN: ./bin/godot.macos.${{ matrix.target }}.universal

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ env.CACHE_NAME }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Preflight real signed external host and launchd
        if: matrix.target == 'editor' && !inputs.maliang_save_ui && !inputs.registered_worker_close
        run: |
          python3 -m unittest discover -s tools -p test_editor_trusted_hosts.py -v
          python3 -m unittest discover -s tools -p test_macos_external_host_acceptance.py -v
          python3 tools/run_macos_external_host_acceptance.py --preflight --report "$RUNNER_TEMP/external-host-preflight.json" --download-fixtures

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation (x86_64)
        if: ${{ !inputs.tianshu_only && !inputs.maliang_save_ui && !inputs.registered_worker_close }}
        uses: ./.github/actions/godot-build
        with:
          # Silence warning about Metal not being supported in x86_64 builds using `metal=no`.
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ env.EXTRA_FLAGS }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} metal=no
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ env.EXTRA_FLAGS }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Package the exact arm64 editor for native acceptance
        id: q05_package
        if: inputs.registered_worker_close
        run: |
          python3 tools/package_tianshu_ui.py --output bin/tianshu-ui.json
          python3 tools/package_tianshu_board.py --output bin/tianshu-board.json
          app="$RUNNER_TEMP/Q05.app"
          ditto misc/dist/macos_tools.app "$app"
          mkdir -p "$app/Contents/MacOS" "$RUNNER_TEMP/q05-evidence"
          cp bin/godot.macos.editor.arm64 "$app/Contents/MacOS/Godot"
          cp bin/tianshu-{ui,board}.json "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          cp "$app/Contents/MacOS/Godot" bin/godot.macos.editor.arm64
          shasum -a 256 bin/godot.macos.editor.arm64 bin/tianshu-{ui,board}.json data-collection/q05-f01-common.json > "$RUNNER_TEMP/q05-evidence/digests.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/q05-evidence/source.txt"
          uname -sm >> "$RUNNER_TEMP/q05-evidence/source.txt"
          echo "TMPDIR=$(cd "${TMPDIR:-/tmp}" && pwd -P)/" >> "$GITHUB_ENV"
          tar -C bin -czf "$RUNNER_TEMP/registered-worker-editor.tar.gz" godot.macos.editor.arm64 tianshu-ui.json tianshu-board.json

      - name: Retain the editor and its runtime packages
        if: inputs.registered_worker_close
        uses: actions/upload-artifact@v7
        with:
          name: registered-worker-editor
          path: ${{ runner.temp }}/registered-worker-editor.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Install isolated business service fixture
        id: q05_dependencies
        if: ${{ !cancelled() && inputs.registered_worker_close && steps.q05_package.outcome == 'success' }}
        run: python3 -m pip install -r customizations/components/tianxuan/server/requirements.txt

      - name: Close the registered group and recover to the authorized stage
        if: ${{ !cancelled() && steps.q05_dependencies.outcome == 'success' }}
        timeout-minutes: 6
        run: python3 tests/editor/run_macos_registered_worker_close.py --godot bin/godot.macos.editor.arm64 --report "$RUNNER_TEMP/q05-evidence/registered-worker-close.json"

      - name: Reopen the normally saved AI Chat layout in Cocoa
        if: ${{ !cancelled() && steps.q05_dependencies.outcome == 'success' }}
        timeout-minutes: 6
        run: python3 tests/editor/run_workbench_startup_judgments.py --godot bin/godot.macos.editor.arm64 --display-driver macos --report "$RUNNER_TEMP/q05-evidence/sidebar.json"

      - name: Deliver personal judgments before Cocoa restores the layout
        if: ${{ !cancelled() && steps.q05_dependencies.outcome == 'success' }}
        timeout-minutes: 6
        run: python3 tests/editor/run_workbench_startup_judgments.py --godot bin/godot.macos.editor.arm64 --display-driver macos --judgments-first --report "$RUNNER_TEMP/q05-evidence/sidebar-judgments-first.json"

      - name: Validate signed application cold and warm and after each resource change
        if: ${{ !cancelled() && inputs.registered_worker_close && steps.q05_package.outcome == 'success' }}
        timeout-minutes: 18
        run: python3 tests/editor/run_macos_startup_validation.py --app "$RUNNER_TEMP/Q05.app" --manifest data-collection/q05-f01-common.json --report "$RUNNER_TEMP/q05-evidence/startup-sidecars.json"

      - name: Upload native Cocoa evidence
        if: ${{ !cancelled() && inputs.registered_worker_close && steps.q05_package.outcome == 'success' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: q05-native-cocoa
          path: ${{ runner.temp }}/q05-evidence/

      - name: Verify Maliang saves through the macOS system panel
        if: inputs.maliang_save_ui
        run: |
          command -v xcodegen || brew install xcodegen
          python3 tests/editor/run_macos_save_panel.py --godot ./bin/godot.macos.editor.arm64 --output "$RUNNER_TEMP/maliang-save-ui"

      - name: Upload Maliang native Save panel evidence
        if: always() && inputs.maliang_save_ui
        uses: ./.github/actions/upload-artifact
        with:
          name: maliang-save-ui
          path: ${{ runner.temp }}/maliang-save-ui

      - name: Verify Tianshu package switching on arm64
        if: matrix.target == 'editor' && !inputs.maliang_save_ui && !inputs.registered_worker_close
        run: python3 tests/editor/run_tianshu_ui_package.py --godot ./bin/godot.macos.editor.arm64 --report "$RUNNER_TEMP/tianshu-package.json"

      - name: Verify external host trust on macOS
        if: matrix.target == 'editor' && !inputs.maliang_save_ui && !inputs.registered_worker_close
        run: |
          ./bin/godot.macos.editor.arm64 --headless --test --test-case='[Editor][AIChat][ExternalPeer]*'

      - name: Verify real signed external hosts without GUI or model calls
        if: matrix.target == 'editor' && !inputs.maliang_save_ui && !inputs.registered_worker_close
        run: >-
          python3 tools/run_macos_external_host_acceptance.py
          --godot ./bin/godot.macos.editor.arm64
          --report "$RUNNER_TEMP/external-host-acceptance.json"
          --download-fixtures --download-codex

      - name: Upload real signed host acceptance evidence
        if: always() && matrix.target == 'editor' && !inputs.maliang_save_ui && !inputs.registered_worker_close
        uses: ./.github/actions/upload-artifact
        with:
          name: macos-signed-host-acceptance
          path: |
            ${{ runner.temp }}/external-host-preflight.json
            ${{ runner.temp }}/external-host-preflight-logs/*
            ${{ runner.temp }}/external-host-acceptance.json
            ${{ runner.temp }}/external-host-acceptance-logs/*

      - name: Verify Tianshu creator navigation on arm64
        if: matrix.target == 'editor' && !inputs.maliang_save_ui && !inputs.registered_worker_close
        run: |
          for attempt in 1 2 3; do
            python3 tests/editor/run_daqian_graph.py --scenario graph --godot ./bin/godot.macos.editor.arm64 --report "$RUNNER_TEMP/tianshu-graph-$attempt.json"
          done

      - name: Verify Tianshu work-order interactions on arm64
        if: inputs.tianshu_only && !inputs.maliang_save_ui && !inputs.registered_worker_close
        run: |
          for scenario in direct publish parallel entry; do
            python3 tests/editor/run_daqian_graph.py --scenario "$scenario" --godot ./bin/godot.macos.editor.arm64 --report "$RUNNER_TEMP/tianshu-$scenario.json"
          done

      - name: Verify automatic model discovery and cancellation
        if: inputs.tianshu_only && !inputs.maliang_save_ui && !inputs.registered_worker_close
        run: |
          python3 tests/editor/run_model_autofetch.py --godot ./bin/godot.macos.editor.arm64 --source . --node "$(command -v node)" --out "$RUNNER_TEMP/model-autofetch.json"

      - name: Save Godot build cache
        if: ${{ !inputs.tianshu_only && !inputs.maliang_save_ui && !inputs.registered_worker_close }}
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ env.CACHE_NAME }}
        continue-on-error: true

      - name: Prepare artifact
        if: ${{ !inputs.tianshu_only && !inputs.maliang_save_ui && !inputs.registered_worker_close }}
        run: |
          lipo -create ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64 -output ./bin/godot.macos.${{ matrix.target }}.universal
          rm ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        if: ${{ !inputs.tianshu_only && !inputs.maliang_save_ui && !inputs.registered_worker_close }}
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ env.CACHE_NAME }}

      - name: Unit tests
        if: ${{ !inputs.tianshu_only && !inputs.maliang_save_ui && !inputs.registered_worker_close }}
        run: |
          ${{ env.UNIVERSAL_BIN }} --version
          ${{ env.UNIVERSAL_BIN }} --help
          ${{ env.UNIVERSAL_BIN }} --test --force-colors
