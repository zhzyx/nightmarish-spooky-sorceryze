name: Tianxuan deploy build

on:
  pull_request:
    paths:
      - "deploy/**"
      - "apps/tianxuan/**"
      - "customizations/components/tianxuan/**"
      - ".github/workflows/tianxuan-deploy-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull -f deploy/Dockerfile.api -t tianxuan-api:ci .
      - name: Build Web image
        run: docker build --pull -f deploy/Dockerfile.web -t tianxuan-web:ci apps/tianxuan
      - name: Report image sizes
        run: |
          docker image inspect tianxuan-api:ci --format 'api {{.Size}} bytes'
          docker image inspect tianxuan-web:ci --format 'web {{.Size}} bytes'
      - name: Compose smoke
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose --env-file .env up -d --build
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health
          curl -fsS -o /dev/null -w 'web %{http_code}\n' http://127.0.0.1:8080/
          docker compose --env-file .env ps
      - name: WebSocket proxy
        run: |
          python -m pip install --quiet websockets
          python - <<'PY'
          import asyncio
          import websockets

          async def main() -> None:
              try:
                  async with websockets.connect(
                      "ws://127.0.0.1:8080/api/v1/ws/docs/none", open_timeout=10
                  ) as socket:
                      await socket.recv()
              except websockets.exceptions.ConnectionClosed as error:
                  print("ws closed", error.code)
                  assert error.code in (4401, 4404)
              except websockets.exceptions.InvalidStatus as error:
                  print("ws rejected", error.response.status_code)
                  assert error.response.status_code in (401, 403, 404)
              else:
                  raise AssertionError("expected websocket close")

          asyncio.run(main())
          PY
      - name: Compose logs
        if: failure()
        working-directory: deploy
        run: docker compose --env-file .env logs --no-color
      - name: Compose down
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env down -v
