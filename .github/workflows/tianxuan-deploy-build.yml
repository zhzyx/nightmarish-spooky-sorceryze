name: Tianxuan deploy build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dee99e9904988fb65960a97d639fb0b244ab6e4d
      - name: Build exact 1548 candidate
        run: |
          git rev-parse HEAD
          docker build --pull -f deploy/Dockerfile.api -t wenqu-1548:diagnostic .
      - name: Diagnose ordinary package at unchanged budget
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p diagnostics
          docker image inspect wenqu-1548:diagnostic --format '{{.Id}}' > diagnostics/image.txt
          docker create --name wenqu-1548-diagnostic --network none --read-only --memory 192m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864,mode=1777 \
            -e NATIVE_TEST_NODE=/usr/local/bin/node --workdir /app wenqu-1548:diagnostic \
            python -B -m pytest -vv -p no:cacheprovider -k 'not test_250_local_tool_burst' \
            customizations/components/tianxuan/server/test_native_entry_normal.py \
            customizations/components/tianxuan/server/test_native_shared_dispatch.py \
            customizations/components/tianxuan/server/test_native_entry_installation_lifecycle.py \
            customizations/components/tianxuan/server/test_native_entry_context.py \
            customizations/components/tianxuan/server/test_native_entry_broker_context.py \
            customizations/components/tianxuan/server/test_native_entry_remote_normal.py \
            customizations/components/tianxuan/server/test_native_entry_context_resources.py \
            customizations/components/tianxuan/server/test_native_entry_context_admission.py \
            customizations/components/tianxuan/server/test_native_entry_context_backpressure.py \
            customizations/components/tianxuan/sinan-workorders/test_native_entry_producer.py
          docker start wenqu-1548-diagnostic
          while [ "$(docker inspect --format '{{.State.Running}}' wenqu-1548-diagnostic)" = true ]; do
            docker stats --no-stream --format '{{json .}}' wenqu-1548-diagnostic >> diagnostics/stats.jsonl || true
            pid=$(docker inspect --format '{{.State.Pid}}' wenqu-1548-diagnostic)
            if [ "$pid" -gt 0 ] && [ -r "/proc/$pid/cgroup" ]; then
              group=$(awk -F: '$1 == "0" {print $3}' "/proc/$pid/cgroup")
              for metric in memory.current memory.peak memory.events; do
                printf '%s %s ' "$(date -u +%FT%TZ)" "$metric" >> diagnostics/cgroup.txt
                sudo cat "/sys/fs/cgroup$group/$metric" >> diagnostics/cgroup.txt 2>/dev/null || true
              done
            fi
            sleep 1
          done
      - name: Preserve termination evidence
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          docker logs wenqu-1548-diagnostic > diagnostics/tests.log 2>&1 || true
          docker inspect --format '{{json .State}}' wenqu-1548-diagnostic > diagnostics/state.json
          docker inspect --format '{{json .HostConfig}}' wenqu-1548-diagnostic > diagnostics/limits.json
          cat diagnostics/state.json
          tail -n 30 diagnostics/tests.log
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' wenqu-1548-diagnostic)
          exit "$exit_code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wenqu-1548-ordinary-diagnostic
          path: diagnostics/
      - name: Remove owned test container
        if: always()
        run: docker rm -f wenqu-1548-diagnostic || true
