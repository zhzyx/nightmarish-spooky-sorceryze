name: GongGong Issue association

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-association:
    runs-on: ubuntu-latest
    steps:
      # Trusted base workflow only. Never check out or execute PR code here.
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: context.payload.pull_request.number})).data;
            if (pr.state === 'closed') {
              await core.summary.addRaw('Issue association not applicable: the PR is currently closed. This is not candidate admission or a successful revalidation of an earlier failed run.').write();
              return;
            }
            const body = pr.body || '';
            const numbers = [...body.matchAll(/^GongGong-Issue:[ \t]*#([1-9][0-9]*)[ \t]*\r?$/gm)];
            const requests = [...body.matchAll(/^GongGong-Request:[ \t]*([a-z0-9]+(?:-[a-z0-9]+)*)[ \t]*\r?$/gm)];
            if (numbers.length !== 1 || requests.length !== 1) throw Error('Require one GongGong-Issue: #N and one GongGong-Request: stable-id line');
            const issueNumber = Number(numbers[0][1]);
            if (!Number.isSafeInteger(issueNumber)) throw Error('Invalid Issue number');
            const issue = (await github.rest.issues.get({owner, repo, issue_number: issueNumber})).data;
            if (issue.pull_request || issue.state !== 'open' || issue.number !== issueNumber) throw Error('Require a real open Issue in this repository');
            const definitions = (await github.rest.repos.getContent({owner, repo, path: '.github/labels.json', ref: pr.base.sha})).data;
            const types = new Set(JSON.parse(Buffer.from(definitions.content, 'base64').toString('utf8')).map(x => x.name));
            const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            const category = labels.filter(x => x.startsWith('type:'));
            const status = labels.filter(x => x.startsWith('status:'));
            if (!labels.includes('workspace:gonggong')) throw Error('Require workspace:gonggong');
            if (category.length !== 1 || !types.has(category[0])) throw Error('Require exactly one known type label');
            if (status.length !== 1 || !['status:in-progress', 'status:in-review'].includes(status[0])) throw Error('Require exactly one active status label');
            const issueBody = issue.body || '';
            const ids = new Set([
              ...[...issueBody.matchAll(/<!--\s*(?:gonggong|olympus)-request:([a-z0-9]+(?:-[a-z0-9]+)*)\s*-->/g)].map(x => x[1]),
              ...[...issueBody.matchAll(/^### 稳定需求 ID\s*\n+([a-z0-9]+(?:-[a-z0-9]+)*)[ \t]*(?=\r?$)/gm)].map(x => x[1])
            ]);
            if (ids.size !== 1 || !ids.has(requests[0][1])) throw Error('Issue request identity must match unambiguously');
            const requestId = requests[0][1];
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
            const changed = files.filter(f => f.status !== 'removed');
            const events = changed.filter(f => f.filename.startsWith('gonggong-diting-data/events/gonggong-workspace/') && f.filename.endsWith('.json'));
            const collection = changed.filter(f => f.filename.startsWith('data-collection/') && f.filename.endsWith('.json'));
            async function jsonFromPr(file) {
              const response = await github.rest.git.getBlob({owner, repo, file_sha: file.sha});
              if (response.data.encoding !== 'base64') throw Error('Expected JSON blob in PR: ' + file.filename);
              return JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            }
            let matchingEvent = false;
            for (const file of events) {
              const event = await jsonFromPr(file);
              if (event.tenant_id === 'gonggong-workspace' && event.request_id === requestId) matchingEvent = true;
            }
            let matchingCollection = false;
            for (const file of collection) {
              const evidence = await jsonFromPr(file);
              if (evidence.request_id === requestId && (evidence.issue === issue.html_url || evidence.issue_url === issue.html_url || evidence.issue_number === issueNumber)) matchingCollection = true;
            }
            if (matchingEvent && !matchingCollection) throw Error('Recorded Diting event must be delivered with matching data-collection evidence');
            if (!matchingEvent) core.warning('No successful Diting event for this request was included in this PR; collection coverage remains unknown, but submission is allowed.');
            await core.summary.addRaw(`Issue association checked. Matching Diting event in PR: ${matchingEvent}; matching collection evidence in PR: ${matchingCollection}. Missing recording does not block this check. This does not execute PR code, authenticate admission, validate Diting contents, or confirm Diting consumption.`).write();
