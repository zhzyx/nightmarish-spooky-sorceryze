name: Tianxuan tests

on:
  pull_request:
    paths:
      - "customizations/components/tianxuan/**"
      - "apps/tianxuan/**"
      - "deploy/**"
      - ".github/workflows/tianxuan-tests.yml"
  merge_group:

permissions:
  contents: read

jobs:
  tests:
    name: Module and web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "apps/tianxuan/package-lock.json"
      - name: Install Python test dependencies
        run: pip install fastapi httpx pytest
      - name: Configure git identity for merge tests
        run: |
          git config --global user.name "Tianxuan Test"
          git config --global user.email "tianxuan@example.invalid"
      - name: Run Tianxuan server and Duobao tests
        env:
          GIT_EXECUTABLE: git
        run: python -m pytest customizations/components/tianxuan -q
      - name: Typecheck and build Tianxuan web shell
        working-directory: apps/tianxuan
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
