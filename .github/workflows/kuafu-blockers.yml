name: GongGong Kuafu blockers
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('kuafu-local-{0}', inputs.incident) ||
      format('Kuafu {0} {1}', github.event_name, github.event.workflow_run.id || github.event.issue.number) }}

on:
  workflow_run:
    workflows: ["**", "!GongGong Kuafu blockers"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_issue:
        description: Original workspace Issue number
        required: true
        type: string
      request_id:
        description: Stable request ID on the original Issue
        required: true
        type: string
      action:
        description: Blocked local operation
        required: true
        type: choice
        options: [intake, validation, delivery, dispatch, user-report, dependency, permission, unknown-receipt, other]
      incident:
        description: SHA-256 identifier of the locally retained incident
        required: true
        type: string
      head:
        description: Full Git HEAD reported by the local operator
        required: true
        type: string
  issues:
    types: [labeled]

permissions: {}

jobs:
  triage:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'issues' && github.event.label.name == 'status:blocked') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.path != '.github/workflows/kuafu-blockers.yml' &&
      (contains(fromJSON('["failure","startup_failure","timed_out","action_required"]'), github.event.workflow_run.conclusion) ||
      (github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push","pull_request","pull_request_target"]'), github.event.workflow_run.event))))
    concurrency:
      # Local, label and CI events can claim the same tracker. Serialize lookup and registration.
      group: kuafu-blocker-registration
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      # Always check out the authenticated default-branch event SHA. Never execute triggering code or artifacts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the event and register or recheck the blocker
        id: triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 customizations/components/issue-workorders/kuafu_github.py
      - name: Retain triage evidence and file recording receipt
        if: failure() || steps.triage.outputs.has_evidence == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kuafu-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuafu-evidence
          if-no-files-found: warn
          retention-days: 30
