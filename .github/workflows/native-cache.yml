name: Native cache dependency boundaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-tests:
    name: Native cache boundaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-deps
        with:
          python-version: "3.12"
      - name: Install pinned WebView2 SDK for Windows graph audit
        if: runner.os == 'Windows'
        run: python tools/install_webview2.py
      - name: Verify cache identity, consumers and single producer
        shell: bash
        run: |
          python tools/test_build_engine_modules.py
          python tests/editor/test_editor_native_cache.py
          python tests/editor/test_native_host_inputs.py
          python tools/test_windows_editor_artifact.py
