{
  "name": "研究、调研与试验",
  "description": "创建研究、调研与试验工单",
  "labels": [
    "type:research",
    "status:needs-decision"
  ],
  "body": [
    {
      "type": "input",
      "id": "request-id",
      "attributes": {
        "label": "稳定需求 ID",
        "description": "如 issue-workflow-20261102；一个需求只建一张主工单"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "host-git-account",
      "attributes": {
        "label": "宿主 GitHub 账号",
        "description": "填写实际创建或接收此工单的 GitHub login；宿主需回读认证身份，不能仅凭此字段授权"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "design-doc",
      "attributes": {
        "label": "需求文档",
        "description": "design-docs/ 下的 .md 路径或仓库链接"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "scope",
      "attributes": {
        "label": "目标与范围"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "acceptance",
      "attributes": {
        "label": "验收标准"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "依赖、责任人与阻塞"
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "验证与采集证据",
        "description": "链接实际产物、olympus-hermes-data 事件和 data-collection 来源索引；未知留空"
      }
    }
  ]
}
