[tool.mypy]
disallow_any_generics = true
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
no_implicit_optional = true
pretty = true
show_column_numbers = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
exclude = ["thirdparty/"]
python_version = "3.10"

[tool.ruff]
extend-exclude = ["thirdparty"]
extend-include = ["*SConstruct", "*SCsub"]
target-version = "py310"
line-length = 120
preview = true
fix = true

[tool.ruff.lint]
# NOTE: Starting with `0.15.2`, ruff uses a SIGNIFICANTLY expanded set of default rules for
#  preview builds. While expanding into these new rulesets is something we're interested in,
#  we'll adopt them gradually, depending on our needs. As such, our base `select` utilizes the
#  legacy defaults.
select = ["E4", "E7", "E9", "F"]
extend-select = [
	"FA", # flake8-future-annotations.
	"I",  # isort.
	"UP", # pyupgrade.
]
ignore = [
	"UP015", # Unnecessary mode argument.
]
extend-safe-fixes = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"{SConstruct,SCsub}" = [
	"E402", # Module level import not at top of file.
	"F403", # Undefined local with import star.
	"F405", # Undefined local with import star usage.
]

[tool.ruff.lint.isort]
sections = { metadata = ["misc.utility.scons_hints"] }
section-order = [
	"future",
	"metadata",
	"standard-library",
	"third-party",
	"first-party",
	"local-folder",
]

[tool.codespell]
enable-colors = true
write-changes = true
check-hidden = true
quiet-level = 3
builtin = ["clear", "rare", "en-GB_to_en-US"]
skip = [
	".mailmap",
	"*.desktop",
	"*.gitignore",
	"*.po",
	"*.pot",
	"*.rc",
	"AUTHORS.md",
	"COPYRIGHT.txt",
	"core/input/gamecontrollerdb.txt",
	"core/string/locales.h",
	# Preserve exact quoted spelling and hashes in the immutable #1003 correction evidence.
	"data-collection/generation-owned-process-recovery-1003-spelling-correction.json",
	"gonggong-diting-data/events/gonggong-workspace/generation-owned-process-recovery-20261113/kuafu-c78db041530660edf849a9fb21626ecb327a0ae8.json",
	# Preserve the original spelling and digest of this independently reviewed #1024 incident.
	"gonggong-diting-data/events/gonggong-workspace/bound-production-continuation-20261113/kuafu-4e99e9707f0203e5bb041f41489a9ad17e275748.json",
	# Preserve the signed diagnostic wording in the #750 Kuafu receipt.
